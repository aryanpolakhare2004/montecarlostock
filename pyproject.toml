[project]
name = "mcstock"
version = "0.1.0"
description = "Monte Carlo simulations for stock prices, trading strategies, and portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "yfinance>=0.2",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "vaderSentiment>=3.3",
    "feedparser>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
mcstock = "mcstock.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
reddit = ["praw>=7.7"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcstock*"]
